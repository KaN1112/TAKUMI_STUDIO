<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TAKUMI STUDIOの作品一覧とお問い合わせ先。">
  <title>TAKUMI STUDIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>TAKUMI STUDIO</h1>
  </header>

  <main id="works" class="site-main">
    <section class="works" aria-label="作品一覧">
      <div class="work-grid">
        <article class="work-card">
          <a class="work-image-link" href="#work-1" aria-label="作品1の画像を拡大する">
            <img src="assets/images/work-1.svg" alt="作品1の画像（差し替え用）" width="800" height="600">
          </a>
          <h2>作品名を入力 1</h2>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-2" aria-label="作品2の画像を拡大する">
            <img src="assets/images/work-2.svg" alt="作品2の画像（差し替え用）" width="800" height="600">
          </a>
          <h2>作品名を入力 2</h2>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-3" aria-label="作品3の画像を拡大する">
            <img src="assets/images/work-3.svg" alt="作品3の画像（差し替え用）" width="800" height="600">
          </a>
          <h2>作品名を入力 3</h2>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-4" aria-label="作品4の画像を拡大する">
            <img src="assets/images/work-4.svg" alt="作品4の画像（差し替え用）" width="800" height="600">
          </a>
          <h2>作品名を入力 4</h2>
        </article>
      </div>
    </section>

    <section class="contact" aria-label="お問い合わせ">
      <p>ご依頼は TAKUMI STUDIO 公式Xまで！</p>
      <a class="contact-link" href="https://x.com/" target="_blank" rel="noopener noreferrer">公式Xはこちら</a>
    </section>
  </main>

  <aside id="work-1" class="lightbox" role="dialog" aria-modal="true" aria-label="作品1の拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/work-1.svg" alt="作品1の画像（差し替え用）" width="800" height="600">
  </aside>

  <aside id="work-2" class="lightbox" role="dialog" aria-modal="true" aria-label="作品2の拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/work-2.svg" alt="作品2の画像（差し替え用）" width="800" height="600">
  </aside>

  <aside id="work-3" class="lightbox" role="dialog" aria-modal="true" aria-label="作品3の拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/work-3.svg" alt="作品3の画像（差し替え用）" width="800" height="600">
  </aside>

  <aside id="work-4" class="lightbox" role="dialog" aria-modal="true" aria-label="作品4の拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/work-4.svg" alt="作品4の画像（差し替え用）" width="800" height="600">
  </aside>
</body>
</html>
