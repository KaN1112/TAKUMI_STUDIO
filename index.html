<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TAKUMI STUDIOの作品一覧とお問い合わせ先。">
  <title>TAKUMI STUDIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>
      <img src="assets/images/takumi-logo.png" alt="TAKUMI ENTERTAINMENT STUDIO" width="1600" height="900">
    </h1>
  </header>

  <main id="works" class="site-main">
    <section class="works" aria-label="作品一覧">
      <div class="work-grid">
        <article class="work-card">
          <a class="work-image-link" href="#work-1" aria-label="WELCOMEポスターを拡大する">
            <img src="assets/images/welcome.png" alt="赤と黒の空間に立体的なWELCOMEの文字を配置したポスター" loading="lazy">
          </a>
          <h2>WELCOME ポスター</h2>
          <p class="work-medium">Blender</p>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-2" aria-label="MEMBER WANTEDポスターを拡大する">
            <img src="assets/images/member-wanted.png" alt="赤と黒の空間に立体的なMEMBER WANTEDの文字を配置したポスター" loading="lazy">
          </a>
          <h2>MEMBER WANTED ポスター</h2>
          <p class="work-medium">Blender</p>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-3" aria-label="THANK YOUポスターを拡大する">
            <img src="assets/images/thank-you.png" alt="赤と黒の空間に立体的なTHANK YOUの文字を配置したポスター" loading="lazy">
          </a>
          <h2>THANK YOU ポスター</h2>
          <p class="work-medium">Blender</p>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-4" aria-label="MATCH DAYポスターを拡大する">
            <img src="assets/images/match-day.png" alt="白地にMATCH DAYの文字と縦長の構図を配置したポスター" loading="lazy">
          </a>
          <h2>MATCH DAY ポスター</h2>
          <p class="work-medium">Photoshop</p>
        </article>

        <article class="work-card">
          <a class="work-image-link" href="#work-5" aria-label="RESULTポスターを拡大する">
            <img src="assets/images/result.png" alt="白地にエンブレムとRESULTの文字を配置したポスター" loading="lazy">
          </a>
          <h2>RESULT ポスター</h2>
          <p class="work-medium">Photoshop</p>
        </article>

      </div>
    </section>

    <section class="contact" aria-label="お問い合わせ">
      <p>ご依頼は TAKUMI STUDIO 公式Xまで！</p>
      <a class="contact-link" href="https://x.com/takumistudio_jp" target="_blank" rel="noopener noreferrer">公式Xはこちら</a>
    </section>
  </main>

  <aside id="work-1" class="lightbox" role="dialog" aria-modal="true" aria-label="WELCOMEポスターの拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/welcome.png" alt="赤と黒の空間に立体的なWELCOMEの文字を配置したポスター">
  </aside>

  <aside id="work-2" class="lightbox" role="dialog" aria-modal="true" aria-label="MEMBER WANTEDポスターの拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/member-wanted.png" alt="赤と黒の空間に立体的なMEMBER WANTEDの文字を配置したポスター">
  </aside>

  <aside id="work-3" class="lightbox" role="dialog" aria-modal="true" aria-label="THANK YOUポスターの拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/thank-you.png" alt="赤と黒の空間に立体的なTHANK YOUの文字を配置したポスター">
  </aside>

  <aside id="work-4" class="lightbox" role="dialog" aria-modal="true" aria-label="MATCH DAYポスターの拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/match-day.png" alt="白地にMATCH DAYの文字と縦長の構図を配置したポスター">
  </aside>

  <aside id="work-5" class="lightbox" role="dialog" aria-modal="true" aria-label="RESULTポスターの拡大画像">
    <a class="lightbox-close" href="#works" aria-label="拡大画像を閉じる">×</a>
    <img src="assets/images/result.png" alt="白地にエンブレムとRESULTの文字を配置したポスター">
  </aside>

</body>
</html>
